<svg fill="none" height="100%" width="100%" viewBox="0 0 560 560" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Gradient for Bars and Handles -->
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8832A" />
      <stop offset="50%" stop-color="#E8A045" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
    <linearGradient id="filterGradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A045" />
      <stop offset="100%" stop-color="#66BFBF" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="filterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Mask filters for Lottie / SVG slide animation -->
    <filter id="i0"><feComponentTransfer in="SourceGraphic"><feFuncA tableValues="1 0" type="table" /></feComponentTransfer></filter>
    <mask height="20000" width="20000" y="-10000" x="-10000" maskContentUnits="userSpaceOnUse" maskUnits="userSpaceOnUse" style="mask-type: alpha" mask-type="alpha" id="i1">
      <g filter="url(#i0)">
        <rect opacity="0" fill="#ffffff" height="560" width="560" y="0" x="0" />
        <g transform="matrix(1,0,0,1,-279.5,-279.5)">
          <g>
            <g transform="translate(396.25,161.25)">
              <animateTransform repeatCount="indefinite" type="translate" attributeName="transform" dur="1.517s" begin="0s" calcMode="spline" values="396.25 161.25; 166.25 161.25; 166.25 161.25; 396.25 161.25; 396.25 161.25" keyTimes="0; 0.32967; 0.54945; 0.879121; 1" keySplines="0.333 0 0.088 1; 0 0 1 1; 0.333 0 0.088 1; 0 0 1 1" fill="freeze" />
              <g transform="scale(1,1) translate(116.75,1)">
                <g transform="matrix(1,0,0,1,0,0)" id="i2">
                  <g id="i3" transform="matrix(1,0,0,1,-116.75,-1)">
                    <ellipse ry="38.75" rx="38.75" cy="0" cx="0" stroke-width="16" stroke="url(#filterGrad)" fill="url(#filterGrad)" />
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </mask>

    <filter id="i4"><feComponentTransfer in="SourceGraphic"><feFuncA tableValues="1 0" type="table" /></feComponentTransfer></filter>
    <mask height="20000" width="20000" y="-10000" x="-10000" maskContentUnits="userSpaceOnUse" maskUnits="userSpaceOnUse" style="mask-type: alpha" mask-type="alpha" id="i5">
      <g filter="url(#i4)">
        <rect opacity="0" fill="#ffffff" height="560" width="560" y="0" x="0" />
        <g transform="matrix(1,0,0,1,-279.5,-519.375)">
          <g>
            <g transform="translate(314.25,401.125)">
              <animateTransform repeatCount="indefinite" type="translate" attributeName="transform" dur="1.517s" begin="0s" calcMode="spline" values="314.25 401.125; 244.75 401.125; 244.75 401.125; 314.25 401.125; 314.25 401.125" keyTimes="0; 0.32967; 0.54945; 0.879121; 1" keySplines="0.333 0 0.088 1; 0 0 1 1; 0.333 0 0.088 1; 0 0 1 1" fill="freeze" />
